name: .NET CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x

      - name: Restore
        run: dotnet restore amaze.sln

      - name: Build
        run: dotnet build amaze.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test amaze.sln --configuration Release --no-build --no-restore
